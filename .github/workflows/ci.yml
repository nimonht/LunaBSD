name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck -s sh -S warning -e SC1090,SC1091,SC2034,SC2154,SC3043 \
            setup.sh install.sh bootstrap.sh lib/*.sh stages/*.sh files/bin/* \
            caelestia/build.sh files/rc.d/* tests/*.sh tests/vm/*.sh files/shell/fbs-terminal-greeting \
            iso/*.sh iso/ramdisk/init.sh iso/ramdisk/rc iso/live/luna_live iso/live/luna-installer-session \
            iso/live/rc.local iso/live/luna-plasma installer/luna-wifi
          shellcheck -s bash -S warning files/shell/bash.bashrc

      - name: fish and zsh syntax
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends fish zsh
          for f in files/shell/*.fish; do fish -n "$f"; done
          zsh -n files/shell/zshrc files/shell/dot.zshrc

      - name: Hardware detection tests (POSIX sh)
        run: sh tests/run.sh

      - name: Configuration tests (POSIX sh)
        run: sh tests/config-test.sh

      - name: Live USB graphics driver plan (POSIX sh)
        run: sh tests/live-test.sh

      - name: X11 graphics configuration tests (POSIX sh)
        run: sh tests/gpu-config-test.sh

      - name: Limine checksum protection tests (POSIX sh)
        run: sh tests/limine-test.sh

      - name: Package download retry tests (POSIX sh)
        run: sh tests/pkg-retry-test.sh

      - name: efibootmgr parsing tests (POSIX sh)
        run: sh tests/efiboot-test.sh

      - name: Secure Boot building blocks (checked against efitools and sbsigntool)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends efitools sbsigntool binutils
          python3 tests/secureboot-test.py
          sh tests/secureboot-sh-test.sh

      - name: Power profiles D-Bus service tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-glib-2.0 libglib2.0-bin dbus
          sh tests/power-profiles-test.sh
          sh tests/timedate-test.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Graphical installer logic tests (Python)
        run: python3 tests/installer-test.py

      - name: Graphical installer pages load (Qt, off screen)
        run: |
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core fonts-ibm-plex
          pip install --quiet PyQt6 pyflakes
          python3 -m pyflakes installer/luna_installer installer/luna-installer tests/installer-test.py iso/size.py \
            lib/secureboot.py tests/secureboot-test.py tests/vm/mokmanager.py
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software python3 installer/luna-installer --screenshots installer-screens

      - name: Installer screenshots
        uses: actions/upload-artifact@v4
        with:
          name: installer-screens
          path: installer-screens/
